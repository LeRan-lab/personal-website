<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>楽然的小窝 | 主页</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #3a7bd5;
            --light: #f8f9fa;
            --dark: #2d3436;
            --gray: #636e72;
            --shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'PingFang SC', 'Helvetica Neue', sans-serif;
        }
        
        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.7;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        /* 导航栏 */
        header {
            padding: 2rem 0;
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            transition: padding 0.3s;
        }
        
        header.scroll {
            padding: 1rem 0;
            box-shadow: var(--shadow);
        }
        
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
        }
        
        .nav-links a {
            color: var(--dark);
            text-decoration: none;
            font-weight: 500;
            position: relative;
            transition: color 0.3s;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s;
        }
        
        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }
        
        /* 首页内容 - 头像放大并居中 */
        .home-section {
            min-height: 100vh;
            padding: 18vh 0 10vh; /* 减少顶部 padding，避免头像太靠下 */
            display: flex;
            flex-direction: column;
            align-items: center; /* 整体内容居中 */
            text-align: center;
        }
        
        /* 头像容器：放大尺寸并居中 */
        .profile-container {
            position: relative;
            width: 220px; /* 头像放大到 220px（原180px） */
            height: 220px;
            margin-bottom: 3rem;
            /* 确保容器本身居中（冗余保障） */
            margin-left: auto;
            margin-right: auto;
        }
        
        .profile-pic {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 7px solid white; /* 边框略宽，配合放大尺寸 */
            box-shadow: 0 12px 35px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
        }
        
        /* 旋转边框：随头像同步放大 */
        .profile-frame {
            position: absolute;
            top: -12px; /* 边框向外扩展更多，匹配放大后的头像 */
            left: -12px;
            right: -12px;
            bottom: -12px;
            border: 2px dashed var(--primary);
            border-radius: 50%;
            animation: rotate 15s linear infinite;
            z-index: 1;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 3.2rem; /* 标题略大，配合头像比例 */
            margin-bottom: 1rem;
            letter-spacing: -0.5px;
            background: linear-gradient(45deg, var(--primary), #6c5ce7);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .bio {
            font-size: 1.2rem;
            color: var(--gray);
            max-width: 650px;
            margin: 0 auto 4rem;
            line-height: 1.8;
            letter-spacing: 0.3px;
        }
        
        /* 社交媒体图标 */
        .social-links {
            display: flex;
            gap: 1.8rem; /* 图标间距略大，视觉更平衡 */
            justify-content: center;
            margin-bottom: 5rem;
        }
        
        .social-btn {
            width: 65px; /* 图标按钮略大 */
            height: 65px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            text-decoration: none;
            box-shadow: var(--shadow);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid transparent;
        }
        
        .social-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .social-btn.weibo { background: #fff; color: #e6162d; }
        .social-btn.bilibili { background: #fff; color: #fb7299; }
        .social-btn.wechat { background: #fff; color: #07c160; }
        .social-btn.xiaohongshu { background: #fff; color: #fe2c55; }
	.social-btn.douyin { background: #fff; color: #000; }
        
        /* 装饰元素：位置调整，配合头像居中 */
        .decor {
            position: absolute;
            border-radius: 50%;
            background: rgba(58, 123, 213, 0.05);
            z-index: -1;
        }
        
        .decor1 {
            top: 25%;
            left: 50%;
            transform: translateX(-150%); /* 左侧装饰相对居中位置左移 */
            width: 180px;
            height: 180px;
        }
        
        .decor2 {
            bottom: 15%;
            left: 50%;
            transform: translateX(100%); /* 右侧装饰相对居中位置右移 */
            width: 220px;
            height: 220px;
        }
        
        /* 页脚 */
        footer {
            text-align: center;
            padding: 3rem 0;
            color: var(--gray);
            font-size: 0.9rem;
            border-top: 1px solid rgba(0,0,0,0.05);
            margin-top: auto;
        }
        
        /* 响应式调整：在手机上适配放大后的头像 */
        @media (max-width: 768px) {
            .profile-container {
                width: 190px;
                height: 190px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            .bio {
                font-size: 1.1rem;
                padding: 0 1rem;
            }
            
            .social-btn {
                width: 55px;
                height: 55px;
                font-size: 1.3rem;
            }
            
            .decor1, .decor2 {
                width: 120px;
                height: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="decor decor1"></div>
    <div class="decor decor2"></div>

    <header id="header">
        <div class="container">
            <nav>
                <a href="index.html" class="logo">楽然的小窝</a>
                <ul class="nav-links">
                    <li><a href="index.html" class="active">主页</a></li>
                    <li><a href="portfolio.html">作品集</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="home-section">
        <div class="container">
            <div class="profile-container">
                <div class="profile-frame"></div>
                <img src="my-avatar.jpg" alt="我的头像" class="profile-pic">
            </div>
            
            <h1>楽然</h1>
            
            <p class="bio">
                自由插画师 & 二次元furry & 公共营养师，擅长用线条和色彩捕捉生活中的诗意。作品曾入选国际插画展，
                目前专注于儿童绘本创作与品牌视觉设计。喜欢在社交平台分享创作过程，期待与同频的你相遇。
            </p>
            
            <div class="social-links">
                <a href="https://weibo.com/" target="_blank" class="social-btn weibo" title="微博">
                    <i class="fab fa-weibo"></i>
                </a>
                <a href="https://space.bilibili.com/" target="_blank" class="social-btn bilibili" title="哔哩哔哩">
                    <i class="fab fa-bilibili"></i>
                </a>
                <a href="#" class="social-btn wechat" title="微信公众号" onclick="alert('微信公众号：林艺插画集')">
                    <i class="fab fa-weixin"></i>
                </a>
                <a href="https://www.xiaohongshu.com/" target="_blank" class="social-btn xiaohongshu" title="小红书">
                    <i class="fas fa-book-open"></i>
                </a>
  		<a href="https://www.douyin.com/" target="_blank" class="social-btn douyin" title="抖音">
        	    <i class="fab fa-tiktok"></i>
 		</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2025 楽然 | 用艺术连接彼此</p>
        </div>
    </footer>

    <script>
        window.addEventListener('scroll', function() {
            const header = document.getElementById('header');
            if (window.scrollY > 50) {
                header.classList.add('scroll');
            } else {
                header.classList.remove('scroll');
            }
        });
    </script>
</body>
</html>
